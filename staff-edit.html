<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Editor - Spain Work Experience Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="main-nav">
    <div class="nav-logo">
        <img src="logo.png" height="100">
        <span>🇪🇸 Spain 2025/26</span>
    </div>
</nav>

<main class="staff-main">

    <h1>Staff Editing Portal</h1>
    <button onclick="unlock()">Enter Editor</button>

    <div id="editor" style="display:none; margin-top:20px;">

        <h2>Content Editor</h2>

        <div id="fields-container"></div>

        <br>

        <button onclick="generateJSON()">Generate JSON</button>
        <button onclick="loadJSON()">Load JSON</button>
        <button onclick="clearAll()">Clear</button>

        <h3>Output</h3>
        <textarea id="output" rows="15" style="width:100%;"></textarea>

    </div>

</main>

<script>

// 🔑 password
function unlock() {
    const pwd = prompt("Enter password:");
    if (pwd === "admin123") {
        document.getElementById("editor").style.display = "block";
        buildEditor();
        loadJSON();
    } else {
        alert("Wrong password");
    }
}

// 🧠 ALL editable keys (this matches your texts.json)
const keys = [
    "main_title","site_title","admin_content","contact_name","contact_phone","contact_role","footer_text","trip_date",

    "work_title","work_intro","work_overview_title","work_overview_list",
    "work_expectations_title","work_expectations_list",
    "work_comm_title","work_comm_text","work_comm_list",
    "work_food_title","work_food_list",
    "work_prof_title","work_prof_text","work_prof_list"
];

// 🏗️ build inputs dynamically
function buildEditor() {
    const container = document.getElementById("fields-container");
    container.innerHTML = "";

    keys.forEach(key => {
        const wrapper = document.createElement("div");

        const label = document.createElement("label");
        label.innerText = key;

        let input;

        if (key.includes("list") || key.includes("content") || key.includes("text")) {
            input = document.createElement("textarea");
            input.rows = 3;
        } else {
            input = document.createElement("input");
            input.type = "text";
        }

        input.id = key;

        wrapper.appendChild(label);
        wrapper.appendChild(document.createElement("br"));
        wrapper.appendChild(input);
        wrapper.appendChild(document.createElement("br"));
        wrapper.appendChild(document.createElement("br"));

        container.appendChild(wrapper);
    });
}

// 📥 load JSON
async function loadJSON() {
    try {
        const res = await fetch("texts.json");
        const data = await res.json();

        keys.forEach(key => {
            if (document.getElementById(key)) {
                document.getElementById(key).value = data[key] || "";
            }
        });

    } catch (e) {
        alert("Could not load texts.json");
    }
}

// 📤 generate JSON
function generateJSON() {
    const data = {};

    keys.forEach(key => {
        const el = document.getElementById(key);
        if (el) {
            data[key] = el.value;
        }
    });

    document.getElementById("output").value =
        JSON.stringify(data, null, 4);
}

// 🧹 clear
function clearAll() {
    document.querySelectorAll("#fields-container input, #fields-container textarea")
        .forEach(el => el.value = "");

    document.getElementById("output").value = "";
}

</script>

</body>
</html>

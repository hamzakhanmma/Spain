<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Editor - Spain Work Experience Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="main-nav">
    <div class="nav-logo">
        <img src="logo.png" height="100">
        <span>🇪🇸 Spain 2025/26</span>
    </div>
</nav>

<main class="staff-main">

    <h1>Staff Editing Portal</h1>
    <button onclick="unlock()">Enter Editor</button>

    <div id="editor" style="display:none; margin-top:20px;">

        <h2>Content Editor</h2>

        <label>Main Title</label><br>
        <input id="main_title"><br><br>

        <label>Admin Content</label><br>
        <textarea id="admin_content"></textarea><br><br>

        <label>Contact Name</label><br>
        <input id="contact_name"><br><br>

        <label>Contact Phone</label><br>
        <input id="contact_phone"><br><br>

        <label>Contact Role</label><br>
        <input id="contact_role"><br><br>

        <label>Footer Text</label><br>
        <input id="footer_text"><br><br>

        <label>Trip Date (Countdown)</label><br>
        <input type="datetime-local" id="trip_date"><br><br>

        <button onclick="generateJSON()">Generate JSON</button>
        <button onclick="loadJSON()">Load JSON</button>
        <button onclick="clearAll()">Clear</button>

        <h3>Output</h3>
        <textarea id="output" rows="15" style="width:100%;"></textarea>

    </div>

</main>

<script>

// 🔐 password
function unlock() {
    const pwd = prompt("Enter password:");
    if (pwd === "admin123") {
        document.getElementById("editor").style.display = "block";
        loadJSON();
    } else {
        alert("Wrong password");
    }
}

// 📥 load JSON
async function loadJSON() {
    try {
        const res = await fetch("texts.json");
        const data = await res.json();

        document.getElementById("main_title").value = data.main_title || "";
        document.getElementById("admin_content").value = data.admin_content || "";
        document.getElementById("contact_name").value = data.contact_name || "";
        document.getElementById("contact_phone").value = data.contact_phone || "";
        document.getElementById("contact_role").value = data.contact_role || "";
        document.getElementById("footer_text").value = data.footer_text || "";

        // ✅ FIXED DATE LOADING
        if (data.trip_date) {
            const dt = new Date(data.trip_date);

            if (!isNaN(dt)) {
                const formatted = dt.toISOString().slice(0,16);
                document.getElementById("trip_date").value = formatted;
            }
        }

    } catch (e) {
        alert("Could not load texts.json");
    }
}

// 📤 generate JSON
function generateJSON() {
    const data = {
        main_title: document.getElementById("main_title").value,
        admin_content: document.getElementById("admin_content").value,
        contact_name: document.getElementById("contact_name").value,
        contact_phone: document.getElementById("contact_phone").value,
        contact_role: document.getElementById("contact_role").value,
        footer_text: document.getElementById("footer_text").value,

        // ✅ FIXED DATE SAVE (IMPORTANT)
        trip_date: document.getElementById("trip_date").value
    };

    document.getElementById("output").value =
        JSON.stringify(data, null, 4);
}

// 🧹 clear
function clearAll() {
    document.querySelectorAll("#editor input, #editor textarea")
        .forEach(el => el.value = "");

    document.getElementById("output").value = "";
}

</script>

</body>
</html>
